         <div class="p-4 m-5 rounded-3" style="background-color: #6F4E37; width: fit-content;">
            <table class="table table-bordered border-3 border-dark text-center align-middle mb-0" style="table-layout: fixed; width: 300px; height: 300px; font-size: 3rem;">

    </main>
    <script>
        // 1. Seleccionamos la imagen por su ID
        const imagen = document.getElementById("1");

        // 2. Definimos las rutas de las imágenes
        const imagenUno = "cuadrado.jpg";
        const imagenDos = "equis.png";

        // 3. Agregamos un escuchador de eventos para cuando se haga clic
        imagen.addEventListener("click", () => {
        // Comprobamos cuál es la imagen actual y cambiamos a la otra
        if (imagen.src.includes(imagenUno)) {
            imagen.src = imagenDos;
        } else {
            imagen.src = imagenUno;
        }
        });


    </script>
